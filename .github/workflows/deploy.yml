name: Deploy Astro site to gh-pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ "$REPO_NAME" == *.github.io ]]; then
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            BASE_URL="/"
          else
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
            BASE_URL="/${REPO_NAME}"
          fi

          export SITE_URL BASE_URL
          echo "SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"
          echo "BASE_URL=${BASE_URL}" >> "$GITHUB_ENV"
          echo "PUBLIC_PREVIEW=true" >> "$GITHUB_ENV"
          export PUBLIC_PREVIEW="true"
          pnpm run build

      - name: Validate and test
        run: |
          pnpm run validate:brand
          pnpm run validate:build
          pnpm run test:e2e

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
